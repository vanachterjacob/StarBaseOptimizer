<!DOCTYPE html>
<html>
<head>
  <title>Icon Generator for StarBase Optimizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      color: #667eea;
    }
    .instructions {
      background: #f5f5f5;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
      background: white;
    }
    .download-section {
      margin: 20px 0;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin: 5px;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h1>StarBase Optimizer - Icon Generator</h1>

  <div class="instructions">
    <h3>Instructions:</h3>
    <ol>
      <li>Open this HTML file in your browser</li>
      <li>Click the "Generate Icons" button below</li>
      <li>Right-click each canvas and save as PNG with the corresponding filename</li>
      <li>Save to the icons/ directory</li>
    </ol>
  </div>

  <div class="download-section">
    <button onclick="generateIcons()">Generate Icons</button>
  </div>

  <div id="canvases"></div>

  <script>
    function generateIcons() {
      const sizes = [16, 48, 128];
      const container = document.getElementById('canvases');
      container.innerHTML = '';

      sizes.forEach(size => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        // Create gradient background
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, '#667eea');
        gradient.addColorStop(1, '#764ba2');

        // Draw circle
        ctx.beginPath();
        ctx.arc(size / 2, size / 2, size / 2 - 2, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Draw star
        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
        const starSize = size * 0.4;
        drawStar(ctx, size / 2, size / 2 - size * 0.1, 5, starSize, starSize * 0.5);

        // Draw checkmark
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = Math.max(2, size / 20);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(size * 0.35, size * 0.6);
        ctx.lineTo(size * 0.45, size * 0.7);
        ctx.lineTo(size * 0.65, size * 0.45);
        ctx.stroke();

        const label = document.createElement('p');
        label.textContent = `icon${size}.png (${size}x${size}) - Right-click and "Save Image As..."`;
        label.style.marginTop = '5px';

        container.appendChild(canvas);
        container.appendChild(label);
      });
    }

    function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);

      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }

      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fill();
    }
  </script>
</body>
</html>
