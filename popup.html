<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarBase Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>StarBase Optimizer</h1>
      <p class="subtitle">Dynamics 365 CRM Automation</p>
    </div>

    <div class="content">
      <!-- Global Toggle -->
      <div class="toggle-section">
        <div class="toggle-info">
          <h2>Extension Status</h2>
          <p class="description">Enable or disable all automation features</p>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="enabledToggle">
          <span class="slider"></span>
        </label>
      </div>

      <!-- Status Indicator -->
      <div class="status" id="status">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusText">Checking status...</span>
      </div>

      <!-- Features List with Individual Toggles -->
      <div class="features">
        <h3>Features</h3>
        <div id="featuresList">
          <!-- Features will be dynamically populated by popup.js -->
          <div class="feature-loading">
            <p style="font-size: 12px; color: #999; padding: 10px; text-align: center;">
              Loading features...
            </p>
          </div>
        </div>
      </div>

      <!-- Info Section -->
      <div class="info">
        <p><strong>Version:</strong> 1.0.0</p>
        <p><strong>Target:</strong> starbase.crm4.dynamics.com</p>
        <a href="mailto:jacob.vanachter@alistar.net?subject=StarBase%20Optimizer%20Feedback" class="feedback-link" target="_blank">
          📧 Feedback verzenden
        </a>
      </div>
    </div>

    <div class="footer">
      <p>StarBase Support Tool Optimizer</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
